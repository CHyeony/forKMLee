<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/admin/admCss/admStyle.css">


<title>경인산업 설비현황 관리</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/js/script.js" defer></script>

<script>
       fetch('/admin/admMenu.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('header').innerHTML = data; // HTML 삽입 완료
        return new Promise(resolve => setTimeout(resolve, 0)); // DOM 업데이트 기다리기
    })
    .then(() => {
        $("#item2").addClass("active"); // jQuery로 클래스 추가
    })
    .catch(error => console.error('Error loading menu:', error));


    
   
    $(function(){
        searchParams = new URL(location.href).searchParams;
        viewControl();
        
       
    });
  
    function viewControl(){
        var wIdx = searchParams.get('idx');
        var wGubun = searchParams.get('gubun');

       
        console.log(wGubun); // 정리된 값 확인
        if (wGubun.replace(/[\[\]']/g, "").trim() == 'E') {
            $("#saveBtn").hide();
            $(".subjectInput, #sbCateSel").attr("readonly",true);        // readonly 처리
        
            console.log('qwe');
        }else{
            $("#editBtn").hide();
            $("#saveBtn").show();
            $(".subjectInput, #sbCateSel").removeAttr("readonly");       // readonly 삭제
            console.log('2');
        }
    }

</script>
<style>
 
.sch{
    background-color: #a498be8a;
    padding: 7px 10px;
    font-size: 15px;
    font-family: 'GangwonEdu_OTFBoldA';
    margin: 10px 0px;
    width: 100%; /* select 박스가 부모 요소의 크기에 맞게 확장 */
    box-sizing: border-box; /* padding과 border를 너비에 포함시켜 깨짐 방지 */

}
.qnaViewZone{
        margin: 60px 20px;
        /* border: 1px solid #22222d25; */
        padding: 42px;
        background-color: #ffffff4a;
    }
.qnaViewZone>h1{
    font-size:30px;
}

</style>

    
</head>
<body class="flex">

    <!-- 사이드바 (헤더) -->
    <div id="header" class="w-64 h-screen bg-white shadow-md fixed left-0 top-0">
    </div>

    <!-- 컨텐츠 영역 -->
    <form id="editForm" class="formArea">
        <div class="contentZone flex-1 p-4 ml-64">
            <h1 class="text-2xl font-bold">설비현황 <span id="editText"></span></h1>
            <div class="sch">
            ※ 
            </div>
            <div class="qnaViewZone">
          
                
                <table id="optionWrite" class="optionWrite">
                    <tr>
                        <th>카테고리</th>
                        <td>
                            <select id="sbCateSel" class="editSelect">

                                <option value="">선택</option>
                                <option value="A">정밀사출성형기</option>
                                <option value="B">분쇄기</option>
                                <option value="C">기타</option>
                            </select>
                        
                        </td>
                    </tr>
                    <tr>
                        <th>설비명</th>
                        <td><input type="text" id="sbName" class="subjectInput" placeholder="설비명을 입력하세요"></td>
                    </tr>
                    <tr>
                        <th>수량</th>
                        <td><input type="text" id="sbCount" class="subjectInput" value="11"></td>
                    </tr>
                    <tr>
                        <th>비고</th>
                        <td><input type="text" id="sbBgo" class="subjectInput" value="22"></td>
                    </tr>
                </table>
                <button id="editBtn" class="adminBtn_2" onclick="editData();">수정</button>
                <button id="saveBtn" class="adminBtn_2" onclick="saveData();">저장</button>
                <p> 등록일자 : <span id="sbNewDate"> 2025-03-24 10:00:00</span></p>
                <p> 최근수정일자 : <span id="sbEditDate"> 2025-03-24 12:00:00</span></p>
                </span>
                <button id="ListBtn" class="adminBtn_2" onclick="goList();">목록</button>
            
            </div>
        </div>
        </div>
        <script>
            function goList(){
                if(confirm("목록으로 가시겠습니까?")){
                    alert(searchParams);
                }else{
                    return false;
                }
            }
            function editData(){
                if(confirm("수정화면으로 이동하시겠습니까?")){
                    searchParams.set('gubun','U');
                }else{
                    return false;
                }
            }
            function saveData(){
                if(confirm("저장하시겠습니까?")){
                   alert(searchParams);
                  
                }else{
                    return false;
                }
            }
        </script>
    </form>
</body>
</html>
