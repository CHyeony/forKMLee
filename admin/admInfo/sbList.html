<script>
       fetch('/admin/admMenu.html')
    .then(response => response.text())

        document.getElementById('header').innerHTML = data; // HTML 삽입 완료
        return new Promise(resolve => setTimeout(resolve, 0)); // DOM 업데이트 기다리기
    })
    .then(() => {
        $("#item2").addClass("active"); // jQuery로 클래스 추가
    })
    .catch(error => console.error('Error loading menu:', error));


    const data = [
            { no: 1, name: "정밀사출성형기 300ton", qty: 1, note: "동신유압", category: "정밀사출성형기", regiDate:"2025-02-12" },
            { no: 2, name: "정밀사출성형기 220ton", qty: 1, note: "동신유압", category: "정밀사출성형기" , regiDate:"2025-02-12"},
            { no: 3, name: "정밀사출성형기 170ton", qty: 2, note: "동신유압", category: "정밀사출성형기", regiDate:"2025-02-12" },
            { no: 4, name: "정밀사출성형기 120ton", qty: 1, note: "동신유압", category: "정밀사출성형기", regiDate:"2025-02-12" },
            { no: 5, name: "정밀사출성형기 80ton", qty: 2, note: "동신유압", category: "정밀사출성형기", regiDate:"2025-02-12" },
            { no: 6, name: "고속분쇄기(대형)", qty: 1, note: "", category: "분쇄기" , regiDate:"2025-02-12"},
            { no: 7, name: "고속분쇄기(중형)", qty: 1, note: "", category: "분쇄기" , regiDate:"2025-02-12"},
            { no: 8, name: "저속분쇄기", qty: 4, note: "", category: "분쇄기", regiDate:"2025-02-12" },
            { no: 9, name: "온수기", qty: 6, note: "", category: "기타" , regiDate:"2025-02-12"},
            { no: 10, name: "콤프레샤", qty: 1, note: "", category: "기타", regiDate:"2025-02-12" },
            { no: 11, name: "호이스트", qty: 2, note: "", category: "기타" , regiDate:"2025-02-12"},
            { no: 12, name: "제품취출로봇", qty: 7, note: "한양로보틱스", category: "기타" , regiDate:"2025-02-12"}
        ];
    let currentPage = 1;
const rowsPerPage = 10;

function renderTable(category, page = 1) {
    const tbody = $("#listTables tbody");
    tbody.empty();

    const filteredData = category === "전체보기" ? data : data.filter(item => item.category === category);

    // 페이지에 맞게 데이터 잘라서 보여주기
    const startIndex = (page - 1) * rowsPerPage;
    const pagedData = filteredData.slice(startIndex, startIndex + rowsPerPage);

    pagedData.forEach(item => {
        
        tbody.append(`
            <tr>
                <td>${item.no}</td>
                <td><a href='#' onclick='sbEdit();'>${item.name}</a></td>
                <td>${item.qty}</td>
                <td>${item.note}</td>
                <td>${item.category}</td>
                <td>${item.regiDate}</td>
            </tr>
        `);
    });
    renderPagination(filteredData.length, page);
}
function sbEdit(){
    location.href='/admin/admInfo/sbEdit.html';
}
function renderPagination(totalItems, page) {
    const totalPages = Math.ceil(totalItems / rowsPerPage);
    const pagination = $("#pagination");
    pagination.empty();

    // 이전 페이지 버튼
    if (page > 1) {
        pagination.append(`
            <span class="page" data-page="${page - 1}">&lt;</span>
        `);
    }

    // 페이지 번호들
    const startPage = Math.max(1, page - 2);  // 시작 페이지는 현재 페이지에서 두 개 전
    const endPage = Math.min(totalPages, page + 2); // 끝 페이지는 현재 페이지에서 두 개 후

    for (let i = startPage; i <= endPage; i++) {
        pagination.append(`
            <span class="page" data-page="${i}">${i}</span>
        `);
    }

    // 다음 페이지 버튼
    if (page < totalPages) {
        pagination.append(`
            <span class="page" data-page="${page + 1}">&gt;</span>
        `);
    }

    $(".page").on("click", function () {
        currentPage = $(this).data("page");
        renderTable($(".tab.activeTab").data("category"), currentPage);
    });
}


$(document).ready(function () {
    renderTable("전체보기", currentPage);

    $(".tab").on("click", function () {
        $(".tab").removeClass("activeTab");
        $(this).addClass("activeTab");
        renderTable($(this).data("category"), currentPage);
    });
});


</script>
