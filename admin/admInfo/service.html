const rowsPerPage = 10;

function renderTable(category, page = 1) {
    const tbody = $("#listTables tbody");
    tbody.empty();

    const filteredData = category === "전체보기" ? data : data.filter(item => item.category === category);

    // 페이지에 맞게 데이터 잘라서 보여주기
    const startIndex = (page - 1) * rowsPerPage;
    const pagedData = filteredData.slice(startIndex, startIndex + rowsPerPage);

    pagedData.forEach(item => {
        const ansDateClass = item.ansYN === "답변완료" ? "green" : "blue";
        tbody.append(`
            <tr>
                <td>${item.no}</td>
                <td><a href='/admin/admQna/qnaView.html'>${item.subject}</a></td>
                <td>${item.regDate}</td>
                <td class="${ansDateClass}">${item.ansYN}</td>
                <td>${item.ansDate}</td>
                <td>${item.regiMan}</td>
            </tr>
        `);
    });
    renderPagination(filteredData.length, page);
}

function renderPagination(totalItems, page) {
    const totalPages = Math.ceil(totalItems / rowsPerPage);
    const pagination = $("#pagination");
    pagination.empty();

    // 이전 페이지 버튼
    if (page > 1) {
        pagination.append(`
            <span class="page" data-page="${page - 1}">&lt;</span>
        `);
    }

    // 페이지 번호들
    const startPage = Math.max(1, page - 2);  // 시작 페이지는 현재 페이지에서 두 개 전
    const endPage = Math.min(totalPages, page + 2); // 끝 페이지는 현재 페이지에서 두 개 후

    for (let i = startPage; i <= endPage; i++) {
        pagination.append(`
            <span class="page" data-page="${i}">${i}</span>
        `);
    }

    // 다음 페이지 버튼
    if (page < totalPages) {
        pagination.append(`
            <span class="page" data-page="${page + 1}">&gt;</span>
        `);
    }

    $(".page").on("click", function () {
        currentPage = $(this).data("page");
        renderTable($(".tab.activeTab").data("category"), currentPage);
    });
}
