<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/admin/admCss/admStyle.css">


<title>마이 페이지</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/js/script.js" defer></script>

<script>
       fetch('/admin/admMenu.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('header').innerHTML = data; // HTML 삽입 완료
        return new Promise(resolve => setTimeout(resolve, 0)); // DOM 업데이트 기다리기
    })
    .then(() => {
        $("#item7").addClass("active"); // jQuery로 클래스 추가
    })
    .catch(error => console.error('Error loading menu:', error));


  

</script>
<style>
    
 
</style>

    
</head>
<body class="flex">

    <!-- 사이드바 (헤더) -->
    <div id="header" class="w-64 h-screen bg-white shadow-md fixed left-0 top-0">
    </div>

    <!-- 컨텐츠 영역 -->
    <div class="contentZone flex-1 p-4 ml-64">
        <h1 class="text-2xl font-bold">마이 페이지</h1>
       
     
        <div id="infoArea1">
            <div>
                <button id="editInfo" class="adminBtn_2">
                    <span class="clickView"></span>기본정보 수정하기</button>
            </div>
            <table id="idInfo">
                <caption> 기본 정보 </caption>
                <tr>
                    <th>계정</th>
                    <th>
                        <span id="userId" name="userId" class="infoSpan">admin</span>
                    </th>
                </tr>
                <tr>
                    <th>사용자 명</th>
                    <th>
                        <input type="text" id="username" name="username" class="infoInput">
                    </th>
                </tr>
                <tr>
                    <th> 패스워드 </th>
                    <td>
                        <input type="password" id="passwd" name="passwd" class="infoInput">
                    </td>
                </tr>
                <tr>
                    <th> 패스워드 확인</th>
                    <td>
                        <input type="password" id="passwdChk" name="passwdChk" class="infoInput">
                    </td>   
                </tr>
            </table>
        </div>
       
    </div>

</body>
</html>
