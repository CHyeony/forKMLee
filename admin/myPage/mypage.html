<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/admin/admCss/admStyle.css">


<title>마이 페이지</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/js/script.js" defer></script>

<script>
       fetch('/admin/admMenu.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('header').innerHTML = data; // HTML 삽입 완료
        return new Promise(resolve => setTimeout(resolve, 0)); // DOM 업데이트 기다리기
    })
    .then(() => {
        $("#item7").addClass("active"); // jQuery로 클래스 추가
    })
    .catch(error => console.error('Error loading menu:', error));


  

</script>
<style>
       .tab {
            padding: 10px 75px;
            cursor: pointer;
            display: inline-block;
            border: 1px solid #ddd;
            background-color: #f8f8f8;
            margin-right: 11px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        #tabs{
            border-bottom: 2px solid #22222d;
            width: 100%;
            text-align: center;
            
        }
        .tab.activeTab {
            background-color: #22222d;
            font-weight: bold;
            color: #fff;
        }
#listTables{
    width: 100%;
    text-align: center;
}
#listTables>thead>tr{
    background: #22222d;
    color: #fff;
    font-family: 'GangwonEdu_OTFBoldA';
}
#listTables>tbody>tr:nth-child(even){
    background: #e7e5e5;
    
}
       
.sch{
    background-color: #a498be8a;
    padding: 7px 10px;
    font-size: 15px;
    font-family: 'GangwonEdu_OTFBoldA';
    margin: 10px 0px;
    width: 100%; /* select 박스가 부모 요소의 크기에 맞게 확장 */
    box-sizing: border-box; /* padding과 border를 너비에 포함시켜 깨짐 방지 */

}
.sch>select {
    font-size: 15px;
    font-family: 'GangwonEdu_OTFBoldA'; /* 동일한 폰트 적용 */
    padding: 7px 10px;
   
    box-sizing: border-box; /* padding과 border가 포함되도록 */
}
.page {
        cursor: pointer;
        margin: 0 5px;
    }
    .page:hover {
        font-weight: bold;
        color: #007bff;
    }
 
</style>

    
</head>
<body class="flex">

    <!-- 사이드바 (헤더) -->
    <div id="header" class="w-64 h-screen bg-white shadow-md fixed left-0 top-0">
    </div>

    <!-- 컨텐츠 영역 -->
    <div class="contentZone flex-1 p-4 ml-64">
        <h1 class="text-2xl font-bold">마이 페이지</h1>
       
     
        <div style="background-color:#fff;">
            asdaf
        </div>
       
    </div>

</body>
</html>
