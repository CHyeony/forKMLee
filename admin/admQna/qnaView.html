<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/admin/admCss/admStyle.css">


<title>문의내역</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/js/script.js" defer></script>

<script>
    fetch('/admin/admMenu.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;
      });

    const fileList = [];

    $(document).ready(function () {
        ReadData();
    });

    function ReadData(){
        var fileListData = fileList.length<1?"파일이 없습니다":"파일이 있습니다.";
        $("#fileList").text(fileListData);
    };

    

</script>
<style>
    body{background-color:#d2cfda;}
    .qnaViewZone{
        margin: 60px 20px;
        /* border: 1px solid #22222d25; */
        padding: 42px;
        background-color: #ffffff4a;
    }
    .qnaViewZone>h1{
        font-size:30px;
    }

    #qnaTable{
        margin-top: 20px;
        width: 80%;
    }
    #qnaTable tr th{
        font-weight: bold;
        text-align: right;
        padding-right: 15px;
        border-right: 3px solid #22222d;
    }
    #qnaTable tr td{
        padding-left: 15px;
    }
    .anwserZone{
        margin-top:30px;
        color:#575757;
    }

    #ansYn{
        color:darkblue;
    }
    .buttonZone{
        text-align: center;
    }
</style>

    
</head>
<body class="flex">

    <!-- 사이드바 (헤더) -->
    <div id="header" class="w-64 h-screen bg-white shadow-md fixed left-0 top-0">
    </div>

    <!-- 컨텐츠 영역 -->
    <div class="contentZone flex-1 p-4 ml-64">
        <h1 class="text-2xl font-bold">문의 상세</h1>
        <div class="qnaViewZone">
            <h1> <span id="qnaSubject"> 제목 입니다.</span> </h1>
            <table id="qnaTable">
                <colgroup>
                    <col style="width:15%;">
                    <col style="width:45%;">
                    <col style="width:15%;">
                    <col style="width:45%;">
                </colgroup>
                <tr>
                    <th>성함</th>
                    <td><span id="qnaName"> 작성자 </span></td>
                    <th>연락처</th>
                    <td><span id="qnaPhone"> 010 - 0000 - 0000</span></td>
                </tr>
                <tr>
                    <th>소재지</th>
                    <td colspan="3"><span id="qnaAddr">경기도 수원시 권선구 xx로 111</span>&nbsp;<span id="qnaAddrDetail">내건물 8층 8011호</span></td>
                </tr>
                <tr>
                    <th>내용</th>
                    <td colspan="3"><span id="qnaContent">안녕하세요. 제품 문의드립니다. 자세한 사항은 첨부파일 참조 바랍니다.</span></td>
                </tr>
                <tr>
                    <th>첨부파일</th>
                    <td><span id="fileList"></span></td>
                </tr>
              </table>
              <div class="anwserZone">
                  <p>작성일자 : <span id="regiDate">2025-02-11</span></p>
                  <p>답변일자 : <span id="answDate"></span></p>
                  <p>상태 : <span id="ansYn"> 답변 대기 </span></p>
              </div>
              <div class="buttonZone">
                  <button class="adminBtn_1" onclick="qnaSubmit();"> 답변 완료하기 </button>
              </div>
        </div>
    </div>
    <script>
        function qnaSubmit(){
            if(confirm("답변 완료상태로 변경하시겠습니까?")){
                alert("답변 완료되었습니다.");
            }else{
                return false;
            }
        }
    </script>

</body>
</html>
