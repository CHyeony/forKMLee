<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Menu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        @font-face {
            font-family: 'HanaM';
            src: url('/font/Hana2-Medium.ttf') format('truetype');
        }
        @font-face {
            font-family: 'HanaLig';
            src: url('/font/Hana2-Light.ttf') format('truetype');
        }
        @font-face {
            font-family: 'HanaBold';
            src: url('/font/Hana2-Bold.ttf') format('truetype');
        }
        @font-face {
            font-family: 'GangwonEdu_OTFBoldA';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFBoldA.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body{
            font-family: 'GangwonEdu_OTFBoldA';
        }
        .menu-item.active {
            background-color: #80a0df;
            color:#22222d;
            font-weight: bold;
            
        }
        .bg-white {
            background-color:#22222d;
            color:#c5c5c5;
            font-family: 'GangwonEdu_OTFBoldA';
        }
        .menu-item:hover{
            background-color:#c5c5c5;
            color:#22222d;
            font-weight: bold;
        }
        
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<div class="w-64 h-screen bg-white shadow-md flex flex-col p-4">
   
    <!-- 타이틀 -->
    <h1 class="text-lg font-bold border-b pb-2 mb-4"><a href='/admin/adminWelcome.html'>관리자페이지</a></h1>
    
    <!-- 메뉴 리스트 -->
    <div class="mb-4">
        <h2 class="text-md font-semibold mb-2">내용 변경</h2>
        <ul>
            <a href="#" onclick="goPage('admInfo','introEdit');"><li class="py-2 px-4 rounded-md cursor-pointer menu-item" id="item1" data-path="/intro.html">경인산업 소개말</li></a>
            <a href="#" onclick="goPage('admInfo','sbList');"><li class="py-2 px-4 rounded-md cursor-pointer menu-item" id="item2" data-path="/page2.html">설비현황 관리</li></a>
            <a href="#" onclick="goPage('admInfo','service');"><li class="py-2 px-4 rounded-md cursor-pointer menu-item "id="item3" data-path="/page3.html">사출서비스 안내</li></a>
        </ul>
    </div>
    <div class="mb-4">
        <h2 class="text-md font-semibold mb-2">계정관리</h2>
        <ul>
            <li class="py-2 px-4 rounded-md cursor-pointer menu-item" data-path="/account.html">계정관리</li>
        </ul>
    </div>
    <div class="mb-4">
        <h2 class="text-md font-semibold mb-2">제품</h2>
        <ul>
            <a href="#" onclick="goPage('products','product');"><li class="py-2 px-4 rounded-md cursor-pointer menu-item item4" data-path="/product.html">생산제품</li></a>
            <a href="#" onclick="goPage('products','sympad');"><li class="py-2 px-4 rounded-md cursor-pointer menu-item item5" data-path="/sympad.html">심패드</li></a>
        </ul>
    </div>
    <div class="mb-4">
        <h2 class="text-md font-semibold mb-2">문의내역</h2>
        <ul>
            <a href="#" onclick="goPage('admQna','qnaList');">
                <li class="py-2 px-4 rounded-md cursor-pointer menu-item" id="item6" data-path="admQna">문의 내역</li>
            </a>            
        </ul>
        
    </div>
    
    <!-- 마이페이지 -->
    <a href="#" onclick="goPage('myPage','mypage')"><h2 class="text-md font-semibold menu-item"  id="item7" data-path="/mypage.html">MYPAGE</h2></a>
    <a href="#" onclick="goPage('admin','login')"><h2 class="text-md font-semibold">로그아웃</h2></a>
</div>

<script>
 $(document).ready(function() {
    console.log("Document is ready");
    const currentPath = window.location.pathname;  // 전체 경로를 가져옴
    console.log("Current Path: ", currentPath); // 경로 로그

    $(".menu-item").each(function() {
        const item = $(this);
        console.log("Menu Item: ", item); // 메뉴 아이템 로그
        console.log("Item Path: ", item.data("path")); // 메뉴 아이템의 data-path 로그
        if (currentPath.includes(item.data("path"))) { // 경로 비교
            item.addClass("active");
            console.log("Active Item: ", item); // 활성화된 아이템 로그
        }
    });
});

  
      
  </script>
</body>
</html>
