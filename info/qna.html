<title>문의사항</title>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="/js/script.js" defer></script>
<script>
    fetch('/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;
      });
  </script>

<body>
	<div id="header"></div>
    <section class="infoTitle">
        <div class="infoTitle-images">
            <img src="/images/mainBanner4.jpg" alt="Banner Image" class="hero-img" width="100%">
        </div>
        <div class="infoTitle-overlay">
            <p class="infoTitle-text">문의사항</p>
        </div>
    </section>

<!-- 이미지 아래 흰색 배경 부분 -->
<section class="infoContent">
    <div class="infoContent-text">
        <div class="contentMent">
         <h2>기본정보 입력</h2>
         
          <table id="qnaTable">
            <tr>
                <th>이름<span class="mustInput">*</span></th>
                <td><input type="text" class="qnaInput mustPut" placeholder="성명을 입력해주세요."></td>
            </tr>
            <tr>
                <th>연락처<span class="mustInput">*</span></th>
                <td><input type="text" class="qnaInput mustPut" placeholder="연락처를 입력해주세요."></td>
            </tr>
            <tr>
                <th rowspan="2">소재지</th>
                <td>
                    
                    <input type="text" id="address" class="qnaInput" placeholder="주소가 여기에 표시됩니다." readonly>
                    <button onclick="execDaumPostcode()">주소 검색</button>
                </td>
            </tr>
            <tr>
                <td><input type="text" class="qnaInput mustPut" placeholder="상세주소를 입력해주세요."></td>
            </tr>
            <tr>
                <th>제목</th>
                <td><input type="text" class="qnaInput" placeholder="제목을 입력해주세요."></td>
            </tr>
            <tr>
                <th>내용</th>
                <td><textarea class="qnaInput" placeholder="내용을 입력해주세요."></textarea></td>
            </tr>
            <tr>
                <th>첨부파일</th>
                <td><input type="file" class="qnaInput"></td>
            </tr>
          </table>
        </div>
        <script>
          function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    document.getElementById("address").value = data.address; // 주소 입력
                }
            }).open();
          }
        </script>
    </div>
</section>
