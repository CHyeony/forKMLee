<style>
  #map {
    width: 100%;
    height: 400px;

<title>회사 소개</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="/js/script.js" defer></script>
<script>
    fetch('/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;
      });
  </script>
</head>
<body>
	<div id="header"></div>
    <section class="infoTitle">
        <div class="infoTitle-images">
            <img src="/images/mainBanner3.jpg" alt="Banner Image" class="hero-img" width="100%">
        </div>
        <div class="infoTitle-overlay">
            <p class="infoTitle-text">찾아오시는 길</p>
        </div>
    </section>

<!-- 이미지 아래 흰색 배경 부분 -->
<section class="infoContent">
    <div class="infoContent-text">
        <div id="map"></div>
    
        <script>
            // 지도 표시 영역
            const mapContainer = document.getElementById('map'); 
            const mapOption = {
              center: new kakao.maps.LatLng(37.3947, 126.7352), // 기본 좌표
              level: 3 // 확대 수준
            };
        
            const map = new kakao.maps.Map(mapContainer, mapOption); // 지도 생성
        
            // 주소-좌표 변환 객체 생성
            const geocoder = new kakao.maps.services.Geocoder();
        
            // 주소 검색 및 결과 처리
            geocoder.addressSearch('경기도 시흥시 월곶동 619-8', function(result, status) {
              if (status === kakao.maps.services.Status.OK) {
                const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
        
                // 지도 중심 이동
                map.setCenter(coords);
        
                // 마커 표시
                const marker = new kakao.maps.Marker({
                  map: map,
                  position: coords
                });
        
                // 인포윈도우 추가
                const infowindow = new kakao.maps.InfoWindow({
                  content: '<div style="padding:5px;">경기도 시흥시 월곶동 619-8</div>'
                });
                infowindow.open(map, marker);
              } else {
                alert('주소를 찾을 수 없습니다.');
              }
            });
          </script>
    </div>
</section>
