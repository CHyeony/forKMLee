<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/sub.css">
<link rel="stylesheet" href="/css/header.css?version=1.1">
<link rel="stylesheet" href="/sub.css?version=1.1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  #map {
    width: 100%;
    height: 400px;
  }
</style>

<title>회사 소개</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="js/script.js" defer></script>
<script>
    fetch('/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;
      });
  </script>
</head>
<body>
	<div id="header"></div>
    <section class="infoTitle">
        <div class="infoTitle-images">
            <img src="/images/mainBanner3.jpg" alt="Banner Image" class="hero-img" width="100%">
        </div>
        <div class="infoTitle-overlay">
            <p class="infoTitle-text">찾아오시는 길</p>
        </div>
    </section>

<!-- 이미지 아래 흰색 배경 부분 -->
<section class="infoContent">
    <div class="infoContent-text">
        <div id="map"></div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            const map = L.map('map').setView([37.3887, 126.7355], 16); // 해당 주소 좌표
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '© OpenStreetMap contributors',
            }).addTo(map);
            L.marker([37.3887, 126.7355]).addTo(map)
              .bindPopup('<b>경기도 시흥시 월곶고잔3길 70-6</b>')
              .openPopup();
          </script>
    </div>
</section>
 <!-- FOOTER -->
 <footer class="footer">

        </div>

            <ul>
                <li>이메일: kiplastic@naver.com</li>
                <li>소재지: 경기도 시흥시 월곶고잔3길 70-6(월곶동)</li>
            </ul>
        </div>
        <div class="footer-section">
            <h3>소셜 미디어</h3>
