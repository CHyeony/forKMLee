<script>
    fetch('/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;
      });

      const data = [
            { no: 1, name: "정밀사출성형기 300ton", qty: 1, note: "동신유압", category: "정밀사출성형기" },
            { no: 2, name: "정밀사출성형기 220ton", qty: 1, note: "동신유압", category: "정밀사출성형기" },
            { no: 3, name: "정밀사출성형기 170ton", qty: 2, note: "동신유압", category: "정밀사출성형기" },
            { no: 4, name: "정밀사출성형기 120ton", qty: 1, note: "동신유압", category: "정밀사출성형기" },
            { no: 5, name: "정밀사출성형기 80ton", qty: 2, note: "동신유압", category: "정밀사출성형기" },
            { no: 6, name: "고속분쇄기(대형)", qty: 1, note: "", category: "분쇄기" },
            { no: 7, name: "고속분쇄기(중형)", qty: 1, note: "", category: "분쇄기" },
            { no: 8, name: "저속분쇄기", qty: 4, note: "", category: "분쇄기" },
            { no: 9, name: "온수기", qty: 6, note: "", category: "온수기" },
            { no: 10, name: "콤프레샤", qty: 1, note: "", category: "기타" },
            { no: 11, name: "호이스트", qty: 2, note: "", category: "기타" },
            { no: 12, name: "제품취출로봇", qty: 7, note: "한양로보틱스", category: "기타" }
        ];

        function renderTable(category) {
            const tbody = $("#dataTable tbody");
            tbody.empty();

            const filteredData = category === "전체보기" ? data : data.filter(item => item.category === category);

            filteredData.forEach(item => {
                tbody.append(`
                    <tr>
                        <td>${item.no}</td>
                        <td>${item.name}</td>
                        <td>${item.qty}</td>
                        <td>${item.note}</td>
                    </tr>
                `);
            });
        }

        $(document).ready(function () {
            renderTable("전체보기");

            $(".tab").on("click", function () {
                $(".tab").removeClass("active");
                $(this).addClass("active");
                renderTable($(this).data("category"));
            });
        });
  </script>
     <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        .tab {
            padding: 10px 50px;
            cursor: pointer;
            display: inline-block;
            border: 1px solid #ddd;
            background-color: #f8f8f8;
            margin-right: 5px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .tab.active {
            background-color: #132562;
            font-weight: bold;
            color: #fff;
        }
    </style>
