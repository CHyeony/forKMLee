/* 반갈 */
#textCut{
    font-family: 'Roboto', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
#cutText {
  font-size: calc(10vw + 0.5rem);
  font-weight: 900;
  text-transform: uppercase;
  color: black;
  position: relative;
  background: linear-gradient(transparent 50%, #000 50%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  &::after {
    content: attr(data-heading);
    position: absolute;
    left: 0;
    background: linear-gradient(#000 50%, transparent 50%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transform: translate(0px, -2px);
    animation: fracture 5s infinite ease;
  }
}

@keyframes fracture {
  0% {
    transform: translate(0, -2px);
  }
  50% {
    transform: translate(-20px, -2px);
  }
}
</style>

<section id="textCut">
    <h1 contenteditable data-heading="Fracture" id="cutText">Fracture</h1>
</section>
<script>
        // Makes text editable
    var h1 = document.querySelector("h1");

    h1.addEventListener("input", function(e) {
    
    console.log(this.innerHTML)
        this.setAttribute("data-heading", this.innerText);
    });
</script>
