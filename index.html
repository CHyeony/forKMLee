<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
  body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #222;
}

.banner {
  position: relative;
  width: 100%;
  height: 100%;
  background: url('/images/darkBanner.png') center/cover no-repeat;
  border-radius: 15px;
  overflow: hidden;
}

/* 왼쪽 흐린 배경 */
.overlay {
  position: absolute;
  width: 50%;
  height: 100%;
  background: rgba(255, 255, 255, 0.2); /* 흐릿한 반투명 */
  backdrop-filter: blur(10px); /* 블러 효과 */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

/* 기본 글씨 설정 (안 보일 경우 대비) */
.title, .subtitle {
  font-size: 90px;
  font-weight: bold;
  text-transform: uppercase;
  position: relative;
  display: inline-block;
  color: white; /* 기본 글자색 */
}

/* 클리핑 효과 추가 */
.title::before, .subtitle::before {
  content: attr(data-text); /* 원래 텍스트 유지 */
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('/images/mainBanner.png') center/cover no-repeat;
  background-position: center;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent; /* 글씨 내부 투명 */
}

</style>

<title>회사 소개</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="/js/script.js" defer></script>

</head>
<body>
	<div class="banner">
        <div class="overlay">
          <h2 class="title" data-text="Kyeoung-IN">Kyeoung-IN</h2>
          <p class="subtitle" data-text="Industry">Industry</p>
          
        </div>
      </div>
      

</body>
</html>
