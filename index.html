<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

  /* 애니메이션 효과 */
@keyframes fadeIn {
  0% {
    opacity: 0;
    transform: translateY(30px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}


body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #222;
}

.banner {
  position: relative;
  width: 800px;
  height: 400px;
  background: url('/images/darkBanner.png') center/cover no-repeat;
  border-radius: 15px;
  overflow: hidden;
  display: flex;
}

/* 왼쪽 일반 흰색 글씨 */
.text-left {
  width: 50%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  /*align-items: center;
  text-align: center;*/
  text-align: right;
  margin-right: 10px;
}

.normal {
  font-size: 50px;
  font-weight: bold;
  text-transform: uppercase;
  color: white;
  animation: fadeIn 1s ease-out forwards; /* 애니메이션 추가 */
  opacity: 0;
}

/* 오른쪽 블러 배경 */
.overlay {
  width: 50%;
  height: 100%;
  background: rgba(255, 255, 255, 0.2); /* 반투명 */
  backdrop-filter: blur(10px); /* 블러 효과 */
  display: flex;
  flex-direction: column;
  justify-content: center;
 /* align-items: center;
  text-align: center;*/
  text-align: left;
  padding-left:10px;
  position: relative;
 
}
.overlayFont{
  animation: fadeIn 1s ease-out forwards; /* 애니메이션 추가 */
  opacity: 0;
}

/* 클리핑 효과 적용된 글씨 (오른쪽) */
.clipped {
  font-size: 50px;
  font-weight: bold;
  text-transform: uppercase;
  position: relative;
  color: transparent;
}

.clipped::before {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('/images/darkBanner.png') no-repeat;
  background-size: 1600px 400px; /* 배경 크기 전체 맞춤 */
  background-position: -800px 0; /* 오른쪽 배경 위치 맞춤 */
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

</style>

<title>회사 소개</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="/js/script.js" defer></script>

</head>
<body>
  <div class="banner">
    <!-- 왼쪽: 일반 흰색 글씨 -->
    <div class="text-left">
      <h2 class="title normal"></h2>
      <p class="subtitle normal">INDUSTRY</p>
    </div>
  
    <!-- 오른쪽: 블러 배경 & 클리핑 효과 -->
    <div class="overlay">
      <h2 class="title clipped overlayFont" data-text="KYEONGIN">KYEONGIN</h2>
      <p class="subtitle clipped" data-text=""></p>
    </div>
  </div>

  <!-- <div class="banner">
   
    <div class="text-left">
      <h2 class="title normal">KYEONG</h2>
      <p class="subtitle normal">INDU</p>
    </div>
  
    <div class="overlay">
      <h2 class="title clipped" data-text="-IN">-IN</h2>
      <p class="subtitle clipped" data-text="STRY">STRY</p>
    </div>
  </div>-->
  

</body>
</html>
